<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="50%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#fff0e6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB25B"/>
      <stop offset="100%" stop-color="#FF7E5F"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE4B8"/>
      <stop offset="100%" stop-color="#FFD49A"/>
    </linearGradient>
    <linearGradient id="tabbarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.98)"/>
      <stop offset="100%" stop-color="rgba(255,248,240,0.95)"/>
    </linearGradient>
    <filter id="shadowCard">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF6E61" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowItem">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.04"/>
    </filter>
    <clipPath id="phoneClip">
      <rect x="0" y="0" width="390" height="844" rx="44" ry="44"/>
    </clipPath>
  </defs>

  <!-- Phone body -->
  <rect x="0" y="0" width="390" height="844" rx="44" ry="44" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="390" height="844" rx="44" ry="44" fill="none" stroke="#e0d5cc" stroke-width="1"/>

  <!-- Status bar -->
  <rect x="0" y="0" width="390" height="50" rx="44" ry="0" fill="rgba(255,255,255,0.85)"/>
  <text x="24" y="34" font-family="-apple-system,sans-serif" font-size="14" font-weight="600" fill="#2D3E50">9:41</text>
  <!-- Dynamic island -->
  <rect x="155" y="12" width="80" height="26" rx="13" fill="#1a1a1e"/>
  <!-- Battery/signal icons -->
  <text x="340" y="34" font-family="-apple-system,sans-serif" font-size="13" fill="#2D3E50">●●●</text>

  <!-- Header -->
  <text x="24" y="84" font-family="-apple-system,sans-serif" font-size="13" fill="#9CA8B8">今天</text>
  <text x="24" y="108" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#2D3E50">欢迎，摄影师</text>
  <!-- Avatar -->
  <rect x="318" y="62" width="48" height="48" rx="14" fill="url(#avatarGrad)" filter="url(#shadowItem)"/>
  <text x="342" y="93" font-family="-apple-system,sans-serif" font-size="22" text-anchor="middle">👤</text>

  <!-- AI Card -->
  <rect x="16" y="126" width="358" height="110" rx="20" fill="url(#cardGrad)" filter="url(#shadowCard)"/>
  <!-- Badge -->
  <rect x="32" y="142" width="64" height="26" rx="13" fill="rgba(255,255,255,0.25)"/>
  <text x="64" y="160" font-family="-apple-system,sans-serif" font-size="12" fill="white" text-anchor="middle">AI 拍摄</text>
  <!-- Title -->
  <text x="32" y="192" font-family="-apple-system,sans-serif" font-size="18" font-weight="700" fill="white">智能构图 · 姿势指导</text>
  <!-- Desc -->
  <text x="32" y="216" font-family="-apple-system,sans-serif" font-size="13" fill="rgba(255,255,255,0.9)">自动优化角度、光线、构图</text>

  <!-- Grid Items row 1 -->
  <!-- Item 1: 智能拍摄助手 -->
  <rect x="16" y="254" width="177" height="100" rx="18" fill="rgba(255,255,255,0.98)" filter="url(#shadowItem)"/>
  <rect x="52" y="272" width="52" height="52" rx="14" fill="#fff7e6"/>
  <text x="78" y="306" font-family="-apple-system,sans-serif" font-size="24" text-anchor="middle">📷</text>
  <text x="104" y="340" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#2D3E50" text-anchor="middle">智能拍摄助手</text>

  <!-- Item 2: 人脸绑定 -->
  <rect x="203" y="254" width="171" height="100" rx="18" fill="rgba(255,255,255,0.98)" filter="url(#shadowItem)"/>
  <rect x="237" y="272" width="52" height="52" rx="14" fill="#f5efff"/>
  <text x="263" y="306" font-family="-apple-system,sans-serif" font-size="24" text-anchor="middle">🔐</text>
  <text x="288" y="340" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#2D3E50" text-anchor="middle">人脸绑定</text>

  <!-- Grid Items row 2 -->
  <!-- Item 3: 自拍分析 -->
  <rect x="16" y="364" width="177" height="100" rx="18" fill="rgba(255,255,255,0.98)" filter="url(#shadowItem)"/>
  <rect x="52" y="382" width="52" height="52" rx="14" fill="#e1ffee"/>
  <text x="78" y="416" font-family="-apple-system,sans-serif" font-size="24" text-anchor="middle">👤</text>
  <text x="104" y="450" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#2D3E50" text-anchor="middle">自拍分析</text>

  <!-- Item 4: 环境分析 -->
  <rect x="203" y="364" width="171" height="100" rx="18" fill="rgba(255,255,255,0.98)" filter="url(#shadowItem)"/>
  <rect x="237" y="382" width="52" height="52" rx="14" fill="#e0f7ff"/>
  <text x="263" y="416" font-family="-apple-system,sans-serif" font-size="24" text-anchor="middle">🌤️</text>
  <text x="288" y="450" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#2D3E50" text-anchor="middle">环境分析</text>

  <!-- Grid Items row 3 -->
  <!-- Item 5: 模板评分 -->
  <rect x="16" y="474" width="177" height="100" rx="18" fill="rgba(255,255,255,0.98)" filter="url(#shadowItem)"/>
  <rect x="52" y="492" width="52" height="52" rx="14" fill="#ffe6f0"/>
  <text x="78" y="526" font-family="-apple-system,sans-serif" font-size="24" text-anchor="middle">📋</text>
  <text x="104" y="560" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#2D3E50" text-anchor="middle">模板评分</text>

  <!-- Item 6: 模板合集 -->
  <rect x="203" y="474" width="171" height="100" rx="18" fill="rgba(255,255,255,0.98)" filter="url(#shadowItem)"/>
  <rect x="237" y="492" width="52" height="52" rx="14" fill="#e8f0fe"/>
  <text x="263" y="526" font-family="-apple-system,sans-serif" font-size="24" text-anchor="middle">📁</text>
  <text x="288" y="560" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#2D3E50" text-anchor="middle">模板合集</text>

  <!-- Grid Items row 4 single: 地铁模式 -->
  <rect x="16" y="584" width="177" height="100" rx="18" fill="rgba(255,255,255,0.98)" filter="url(#shadowItem)"/>
  <rect x="52" y="602" width="52" height="52" rx="14" fill="#e8f5e9"/>
  <text x="78" y="636" font-family="-apple-system,sans-serif" font-size="24" text-anchor="middle">🚇</text>
  <text x="104" y="670" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#2D3E50" text-anchor="middle">地铁模式</text>

  <!-- Tab bar -->
  <rect x="0" y="760" width="390" height="84" fill="rgba(255,255,255,0.98)"/>
  <line x1="0" y1="760" x2="390" y2="760" stroke="rgba(255,245,230,0.8)" stroke-width="1"/>
  <!-- Home tab active -->
  <rect x="60" y="770" width="80" height="56" rx="20" fill="rgba(255,140,66,0.06)"/>
  <text x="100" y="800" font-family="-apple-system,sans-serif" font-size="22" text-anchor="middle" fill="#FF8C42">⌂</text>
  <text x="100" y="818" font-family="-apple-system,sans-serif" font-size="11" text-anchor="middle" fill="#FF8C42">首页</text>
  <!-- Profile tab -->
  <text x="290" y="800" font-family="-apple-system,sans-serif" font-size="22" text-anchor="middle" fill="#9CA8B8">👤</text>
  <text x="290" y="818" font-family="-apple-system,sans-serif" font-size="11" text-anchor="middle" fill="#9CA8B8">我的</text>

  <!-- Home indicator -->
  <rect x="155" y="828" width="80" height="4" rx="2" fill="#2D3E50" opacity="0.2"/>
</svg>
