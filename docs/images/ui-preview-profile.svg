  <line x1="32" y1="446" x2="358" y2="446" stroke="rgba(255,245,230,0.8)" stroke-width="1"/>
  <!-- Item 2 -->
  <rect x="32" y="458" width="40" height="40" rx="12" fill="#e1ffee"/>
  <text x="52" y="484" font-family="sans-serif" font-size="20" text-anchor="middle">📊</text>
  <text x="88" y="474" font-family="-apple-system,sans-serif" font-size="15" font-weight="600" fill="#2D3E50">分析记录</text>
  <text x="88" y="492" font-family="-apple-system,sans-serif" font-size="12" fill="#9CA8B8">查看历史分析</text>
  <text x="358" y="484" font-family="-apple-system,sans-serif" font-size="18" fill="#C0CADB" text-anchor="end">›</text>
  <line x1="32" y1="510" x2="358" y2="510" stroke="rgba(255,245,230,0.8)" stroke-width="1"/>
  <!-- Item 3 -->
  <rect x="32" y="522" width="40" height="40" rx="12" fill="#e0f7ff"/>
  <text x="52" y="548" font-family="sans-serif" font-size="20" text-anchor="middle">🌤️</text>
  <text x="88" y="538" font-family="-apple-system,sans-serif" font-size="15" font-weight="600" fill="#2D3E50">环境记录</text>
  <text x="88" y="556" font-family="-apple-system,sans-serif" font-size="12" fill="#9CA8B8">查看环境分析</text>
  <text x="358" y="548" font-family="-apple-system,sans-serif" font-size="18" fill="#C0CADB" text-anchor="end">›</text>

  <!-- Menu section 2 title -->
  <text x="24" y="582" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#9CA8B8">设置与帮助</text>

  <!-- Menu items group 2 -->
  <rect x="16" y="594" width="358" height="178" rx="18" fill="rgba(255,255,255,0.98)" filter="url(#cs)"/>
