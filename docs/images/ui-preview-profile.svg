<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/><stop offset="100%" stop-color="#fff0e6"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB25B"/><stop offset="100%" stop-color="#FF7E5F"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE4B8"/><stop offset="100%" stop-color="#FFD49A"/>
    </linearGradient>
    <linearGradient id="logoutGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#FF4757"/>
    </linearGradient>
    <filter id="cs"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.06"/></filter>
    <filter id="avatarShadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#FF6E61" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="390" height="844" rx="44" fill="url(#bg)"/>
  <rect width="390" height="844" rx="44" fill="none" stroke="#e0d5cc" stroke-width="1"/>

  <!-- Status bar -->
  <text x="24" y="34" font-family="-apple-system,sans-serif" font-size="14" font-weight="600" fill="#2D3E50">9:41</text>

  <!-- Profile header gradient bg -->
  <rect x="0" y="44" width="390" height="220" rx="0" fill="url(#headerGrad)"/>
  <!-- Decorative circles -->
  <circle cx="340" cy="60" r="80" fill="rgba(255,255,255,0.06)"/>
  <circle cx="50" cy="200" r="60" fill="rgba(255,255,255,0.05)"/>

  <!-- Avatar -->
  <circle cx="195" cy="130" r="46" fill="url(#avatarGrad)" filter="url(#avatarShadow)"/>
  <text x="195" y="148" font-family="sans-serif" font-size="42" text-anchor="middle">👤</text>
  <!-- Edit badge -->
  <circle cx="230" cy="162" r="14" fill="white"/>
  <text x="230" y="167" font-family="sans-serif" font-size="13" text-anchor="middle">✏️</text>

  <text x="195" y="198" font-family="-apple-system,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">摄影师小王</text>
  <text x="195" y="218" font-family="-apple-system,sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">ID: 10086</text>

  <!-- Stats row -->
  <rect x="0" y="264" width="390" height="76" fill="rgba(255,255,255,0.95)"/>
  <line x1="0" y1="340" x2="390" y2="340" stroke="rgba(255,245,230,0.8)" stroke-width="1"/>
  <!-- Stat 1 -->
  <text x="97" y="296" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#2D3E50" text-anchor="middle">128</text>
  <text x="97" y="316" font-family="-apple-system,sans-serif" font-size="12" fill="#9CA8B8" text-anchor="middle">照片</text>
  <!-- Divider -->
  <line x1="195" y1="278" x2="195" y2="328" stroke="rgba(255,245,230,0.8)" stroke-width="1"/>
  <!-- Stat 2 -->
  <text x="195" y="296" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#2D3E50" text-anchor="middle">0.87</text>
  <text x="195" y="316" font-family="-apple-system,sans-serif" font-size="12" fill="#9CA8B8" text-anchor="middle">评分</text>
  <!-- Divider -->
  <line x1="293" y1="278" x2="293" y2="328" stroke="rgba(255,245,230,0.8)" stroke-width="1"/>
  <!-- Stat 3 -->
  <text x="342" y="296" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="#2D3E50" text-anchor="middle">7</text>
  <text x="342" y="316" font-family="-apple-system,sans-serif" font-size="12" fill="#9CA8B8" text-anchor="middle">连续天数</text>

