  <text x="358" y="636" font-family="-apple-system,sans-serif" font-size="18" fill="#C0CADB" text-anchor="end">›</text>
  <line x1="32" y1="662" x2="358" y2="662" stroke="rgba(255,245,230,0.8)" stroke-width="1"/>
  <!-- Help -->
  <rect x="32" y="674" width="40" height="40" rx="12" fill="#e8f0fe"/>
  <text x="52" y="700" font-family="sans-serif" font-size="20" text-anchor="middle">❓</text>
  <text x="88" y="690" font-family="-apple-system,sans-serif" font-size="15" font-weight="600" fill="#2D3E50">帮助中心</text>
  <text x="88" y="708" font-family="-apple-system,sans-serif" font-size="12" fill="#9CA8B8">使用帮助与常见问题</text>
  <text x="358" y="700" font-family="-apple-system,sans-serif" font-size="18" fill="#C0CADB" text-anchor="end">›</text>
  <line x1="32" y1="726" x2="358" y2="726" stroke="rgba(255,245,230,0.8)" stroke-width="1"/>
  <!-- About -->
  <rect x="32" y="738" width="40" height="40" rx="12" fill="#f5efff"/>
  <text x="52" y="764" font-family="sans-serif" font-size="20" text-anchor="middle">ℹ️</text>
  <text x="88" y="754" font-family="-apple-system,sans-serif" font-size="15" font-weight="600" fill="#2D3E50">关于我们</text>
  <text x="88" y="772" font-family="-apple-system,sans-serif" font-size="12" fill="#9CA8B8">版本信息与反馈</text>
  <text x="358" y="764" font-family="-apple-system,sans-serif" font-size="18" fill="#C0CADB" text-anchor="end">›</text>

  <!-- Logout button -->
  <rect x="16" y="788" width="358" height="48" rx="24" fill="url(#logoutGrad)"/>
  <text x="195" y="817" font-family="-apple-system,sans-serif" font-size="15" font-weight="600" fill="white" text-anchor="middle">退出登录</text>

  <rect x="155" y="836" width="80" height="4" rx="2" fill="#2D3E50" opacity="0.18"/>
</svg>
