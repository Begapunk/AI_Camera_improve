  <text x="52" y="420" font-family="sans-serif" font-size="20" text-anchor="middle">📁</text>
  <text x="88" y="410" font-family="-apple-system,sans-serif" font-size="15" font-weight="600" fill="#2D3E50">我的模板</text>
  <text x="88" y="428" font-family="-apple-system,sans-serif" font-size="12" fill="#9CA8B8">查看保存的参考</text>
