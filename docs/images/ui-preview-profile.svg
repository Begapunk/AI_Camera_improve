  <rect x="32" y="610" width="40" height="40" rx="12" fill="#fff7e6"/>
  <text x="52" y="636" font-family="sans-serif" font-size="20" text-anchor="middle">⚙️</text>
  <text x="88" y="626" font-family="-apple-system,sans-serif" font-size="15" font-weight="600" fill="#2D3E50">设置</text>
