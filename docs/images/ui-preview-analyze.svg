<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/><stop offset="100%" stop-color="#fff0e6"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1f1a"/><stop offset="100%" stop-color="#1a1210"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB25B"/><stop offset="100%" stop-color="#FF7E5F"/>
    </linearGradient>
    <filter id="cs"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="390" height="844" rx="44" fill="url(#bg)"/>
  <rect width="390" height="844" rx="44" fill="none" stroke="#e0d5cc" stroke-width="1"/>

  <!-- Nav bar -->
  <rect x="0" y="0" width="390" height="94" rx="0" fill="rgba(255,255,255,0.95)"/>
  <rect x="0" y="0" width="390" height="94" rx="44" fill="none"/>
  <line x1="0" y1="94" x2="390" y2="94" stroke="rgba(255,245,230,0.8)" stroke-width="1"/>
  <text x="24" y="34" font-family="-apple-system,sans-serif" font-size="14" font-weight="600" fill="#2D3E50">9:41</text>
  <rect x="20" y="56" width="40" height="28" rx="14" fill="rgba(255,248,240,0.8)"/>
  <text x="40" y="75" font-family="sans-serif" font-size="16" text-anchor="middle">←</text>
  <text x="195" y="76" font-family="-apple-system,sans-serif" font-size="17" font-weight="600" fill="#2D3E50" text-anchor="middle">自拍建议分析</text>

  <!-- Photo area with portrait -->
  <rect x="20" y="110" width="350" height="280" rx="24" fill="url(#photoGrad)" filter="url(#cs)"/>
  <!-- Simulated portrait photo content -->
  <ellipse cx="195" cy="220" rx="55" ry="70" fill="rgba(255,220,180,0.25)"/>
  <ellipse cx="195" cy="185" rx="32" ry="36" fill="rgba(255,200,160,0.4)"/>
  <rect x="163" y="218" width="64" height="80" rx="32" fill="rgba(255,200,160,0.3)"/>
  <!-- Image overlay badges -->
  <rect x="36" y="126" width="80" height="24" rx="12" fill="rgba(52,199,89,0.2)"/>
  <circle cx="48" cy="138" r="5" fill="#34C759"/>
  <text x="60" y="143" font-family="-apple-system,sans-serif" font-size="11" fill="#34C759">分析完成</text>
  <rect x="290" y="126" width="64" height="24" rx="12" fill="rgba(79,70,229,0.8)"/>
  <text x="322" y="143" font-family="-apple-system,sans-serif" font-size="11" fill="white" text-anchor="middle">AI 分析</text>

  <!-- Advice card -->
  <rect x="20" y="406" width="350" height="240" rx="20" fill="rgba(255,255,255,0.98)" filter="url(#cs)"/>
  <!-- Advice header -->
  <rect x="40" y="424" width="40" height="40" rx="12" fill="rgba(255,248,240,0.9)"/>
  <text x="60" y="450" font-family="sans-serif" font-size="20" text-anchor="middle">✨</text>
  <text x="92" y="438" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#2D3E50">AI 专业建议</text>
  <line x1="40" y1="474" x2="350" y2="474" stroke="rgba(255,245,230,0.8)" stroke-width="1"/>
  <!-- Advice content lines -->
  <rect x="40" y="486" width="295" height="10" rx="5" fill="rgba(239,108,62,0.15)"/>
  <rect x="40" y="504" width="260" height="10" rx="5" fill="rgba(239,108,62,0.12)"/>
  <rect x="40" y="522" width="280" height="10" rx="5" fill="rgba(239,108,62,0.1)"/>
  <rect x="40" y="540" width="220" height="10" rx="5" fill="rgba(239,108,62,0.08)"/>
  <text x="40" y="487" font-family="-apple-system,sans-serif" font-size="13" fill="#EF6C3E">建议稍微向左转头约15°，让鼻梁</text>
  <text x="40" y="507" font-family="-apple-system,sans-serif" font-size="13" fill="#EF6C3E">线条更流畅。光线从右侧打入效</text>
  <text x="40" y="527" font-family="-apple-system,sans-serif" font-size="13" fill="#EF6C3E">果更佳，可适当提高下巴角度。</text>
  <!-- Audio button -->
  <rect x="40" y="548" width="140" height="36" rx="18" fill="rgba(255,248,240,0.9)" stroke="rgba(255,140,66,0.3)" stroke-width="1"/>
  <text x="110" y="571" font-family="-apple-system,sans-serif" font-size="13" fill="#EF6C3E" text-anchor="middle">🔊 语音解读建议</text>

  <!-- Capture button -->
  <rect x="20" y="664" width="350" height="56" rx="28" fill="url(#btn)"/>
  <text x="195" y="697" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">🔄 重新拍摄</text>
  <text x="195" y="740" font-family="-apple-system,sans-serif" font-size="12" fill="#9CA8B8" text-anchor="middle">支持相机/相册 · 1080P高清分析</text>

  <rect x="155" y="822" width="80" height="4" rx="2" fill="#2D3E50" opacity="0.18"/>
</svg>
